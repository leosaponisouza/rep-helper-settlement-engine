server:
  port: ${SERVER_PORT:8082}

spring:
  application:
    name: rep-helper-settlement-engine
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/rephelper_settlement}
    username: ${SPRING_DATASOURCE_USERNAME:rephelper}
    password: ${SPRING_DATASOURCE_PASSWORD:rephelper_dev}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

springdoc:
  swagger-ui:
    path: /swagger-ui.html
