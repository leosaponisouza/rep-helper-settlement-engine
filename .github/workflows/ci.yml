name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  verify:
    name: Build & Integration Suite (Java 21)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Install sdd-spring-guardrails (tag 1.0.0)
        run: |
          git clone --depth 1 --branch 1.0.0 https://github.com/leosaponisouza/sdd-spring-guardrails.git /tmp/sdd-spring-guardrails
          mvn -B -f /tmp/sdd-spring-guardrails/pom.xml install -DskipTests

      - name: Run Maven test & SDD guardrails suite
        run: mvn -B test
